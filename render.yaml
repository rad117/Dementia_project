services:
  - type: web
    name: memora-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: WHISPER_MODEL
        value: tiny.en
      # Caps analysed audio so long clips can't OOM the 512 MB free tier.
      - key: MAX_ANALYSIS_SECONDS
        value: "30"
